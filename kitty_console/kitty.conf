# ╔══════════════════════════════════════════════════════╗
# ║          KITTY — Dark Neon Theme by Carl             ║
# ╚══════════════════════════════════════════════════════╝

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  FONTE
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
font_family      JetBrainsMono Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size        13.0

# Ligatures ativas
font_features JetBrainsMonoNFM-Regular +liga +calt +ss01 +ss02
font_features JetBrainsMonoNFM-Bold    +liga +calt
font_features JetBrainsMonoNFM-Italic  +liga +calt

# Ajuste fino de espaçamento
letter_spacing   0.5
line_height      1.4

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  TRANSPARÊNCIA E BLUR
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
background_opacity         0.82
background_blur            32
dynamic_background_opacity yes

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  PALETA — DARK NEON
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Fundo quase preto com leve toque roxo
background            #0d0e1a
foreground            #cdd6f4

# Seleção
selection_background  #7c3aed
selection_foreground  #ffffff

# Cursor neon roxo
cursor                #a855f7
cursor_text_color     #0d0e1a
cursor_shape          beam
cursor_beam_thickness 1.8

# ── Cores normais ────────────────────────────────────────
color0  #1e1e2e   # black
color1  #f38ba8   # red    (neon pink)
color2  #00ff9f   # green  (neon green)
color3  #f9e2af   # yellow
color4  #7c3aed   # blue   (neon purple)
color5  #ff2d78   # magenta (neon pink-red)
color6  #00d4ff   # cyan   (neon cyan)
color7  #cdd6f4   # white

# ── Cores brilhantes ─────────────────────────────────────
color8  #2a2a3d   # bright black (gray)
color9  #ff6b9d   # bright red
color10 #39ff6e   # bright green (super neon)
color11 #ffdd57   # bright yellow
color12 #a855f7   # bright blue (neon violet)
color13 #ff2d78   # bright magenta
color14 #00f5ff   # bright cyan (electric)
color15 #ffffff   # bright white

# Cores da URL ao passar o mouse
url_color #00d4ff

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  JANELA E PADDING
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
window_padding_width      0
window_border_width       1.5px
active_border_color       #a855f7
inactive_border_color     #2a2a3d
bell_border_color         #ff2d78

# Bordas arredondadas (depende do WM — Hyprland suporta)
# Configurar no hyprland.conf: rounding = 12

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  ABAS (TABS)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
tab_bar_edge              bottom
tab_bar_style             powerline
tab_powerline_style       slanted
tab_bar_min_tabs          1
tab_bar_margin_width      0.0
tab_bar_margin_height     4.0 0.0

active_tab_foreground     #0d0e1a
active_tab_background     #a855f7
active_tab_font_style     bold

inactive_tab_foreground   #585b70
inactive_tab_background   #1a1b2e
inactive_tab_font_style   normal

tab_bar_background        #0d0e1a
tab_title_template        " {index}: {title} "

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  ANIMAÇÕES E PERFORMANCE
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Scroll suave
wheel_scroll_multiplier   5.0
touch_scroll_multiplier   5.0

# Sync com refresh rate do monitor
sync_to_monitor           yes

# Renderização
repaint_delay             8
input_delay               3

# Visual bell suave (flash em vez de som)
visual_bell_duration      0
visual_bell_color         #a855f7

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  CURSOR ANIMADO
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
cursor_blink_interval     0.5
cursor_stop_blinking_after 15.0

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  SCROLLBACK
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
scrollback_lines          10000
scrollback_pager          less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  URL
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
url_style                 curly
open_url_with             default
detect_urls               yes

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  ATALHOS CUSTOMIZADOS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Aumentar/diminuir transparência em runtime
map ctrl+shift+a set_background_opacity +0.05
map ctrl+shift+d set_background_opacity -0.05
map ctrl+shift+f set_background_opacity 1.0

# Nova aba
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+w close_tab

# Navegar abas
map ctrl+shift+right next_tab
map ctrl+shift+left  previous_tab

# Split
map ctrl+shift+enter new_window_with_cwd

# Zoom na fonte
map ctrl+equal  change_font_size all +1.0
map ctrl+minus  change_font_size all -1.0
map ctrl+0      change_font_size all 0

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  MISC
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
enable_audio_bell         no
window_alert_on_bell      yes
confirm_os_window_close   0
shell_integration         enabled
# term                      xterm-kitty
term                      xterm-256color

# Força Nerd Font para glifos do bloco PUA (Private Use Area)
symbol_map U+23FB-U+23FE,U+2665,U+26A1,U+2B58,U+E000-U+E00A,U+E0A0-U+E0A3,U+E0B0-U+E0D4,U+E200-U+E2A9,U+E300-U+E3E3,U+E5FA-U+E6AA,U+E700-U+E7C5,U+EA60-U+EBEB,U+F000-U+F2E0,U+F300-U+F32F,U+F400-U+F4A9,U+F500-U+F8FF,U+F0001-U+F1AF0 Symbols Nerd Font Mono
